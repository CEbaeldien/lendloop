<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2ea" />
    <title>LendLoop: you're offline</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { --paper: #eef2ea; --card: #fbfcf9; --ink: #1d2a22; --muted: #5d6b61; --line: #d3dccf; --accent: #d4520b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
        background: var(--paper); color: var(--ink);
        font: 17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
        border-radius: 16px; padding: 28px 24px; text-align: center; }
      h1 { font-size: 26px; line-height: 1.2; margin: 14px 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 20px; color: var(--muted); }
      button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0;
        border-radius: 999px; padding: 11px 22px; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" style="border-radius: 14px" />
      <h1>You're offline</h1>
      <p>LendLoop needs a connection to show tools and requests. Everything is saved on the server, so try again once you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
